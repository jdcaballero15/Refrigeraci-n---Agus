name: Bug
description: Algo no funciona como dice la historia o como se espera.
title: "[BUG] Descripción corta"
labels: ["tipo:bug"]
body:
  - type: markdown
    attributes:
      value: "No pegues datos reales de clientes, DNI, firmas ni precios. Si la captura los muestra, taparlos."
  - type: dropdown
    id: area
    attributes:
      label: Dónde ocurre
      options:
        - Backend (API)
        - App de administración
        - App del técnico
        - Automatizaciones (mantenimiento, PDF, informe)
        - Migración de datos
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado actual
    validations:
      required: true
  - type: input
    id: historia
    attributes:
      label: Historia relacionada (si se conoce)
      placeholder: "E05-02"
