# Chequeos que corren antes de cada commit, en la maquina de cada persona.
# Son los mismos que corre el CI: atrapar un problema aca cuesta segundos,
# atraparlo en el PR cuesta un ciclo de revision.
#
# Instalacion (una vez):  pip install pre-commit && pre-commit install
# Saltearlos con --no-verify esta prohibido (CLAUDE.md) y lo bloquea un hook.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff-check
        files: ^backend/
        args: [--fix]
      - id: ruff-format
        files: ^backend/

  # Repositorio publico: el escaneo de secretos es obligatorio.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: stories-validate
        name: validar historias de usuario
        entry: python3 scripts/validate_stories.py --check-index
        language: system
        pass_filenames: false
        files: ^(docs/stories/|docs/domain/decisiones-pendientes\.md)
